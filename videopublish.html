<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA | Video Publishing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
}

nav{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
    border-bottom:1px solid rgba(139,92,246,.25);
}

.logo{
    color:#a855f7;
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.back{
    color:#aaa;
    text-decoration:none;
}

.container{
    max-width:900px;
    margin:auto;
    padding:60px 20px;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h1{
    font-size:42px;
    background:linear-gradient(90deg,#8b5cf6,#d946ef);
    -webkit-background-clip:text;
    color:transparent;
}

.title p{
    color:#888;
    margin-top:10px;
}

.box{
    background:#0b0f25;
    border:1px solid rgba(139,92,246,.25);
    border-radius:18px;
    padding:40px;
    text-align:center;
}

.icon{
    font-size:60px;
    margin-bottom:20px;
}

.box h2{
    margin-bottom:12px;
}

.box p{
    color:#888;
    line-height:1.7;
}

.publish-btn{
    margin-top:25px;
    padding:13px 25px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.publish-btn:hover{
    background:#a855f7;
}

</style>
</head>

<body>

<nav>

    <div class="logo">
        NEXORA
    </div>

    <a href="owner.html" class="back">
        ← Owner Panel
    </a>

</nav>


<main class="container">

    <div class="title">

        <h1>🎬 VIDEO PUBLISHING</h1>

        <p>
            Manage NEXORA video content
        </p>

    </div>


    <div class="box">

        <div class="icon">
            🎬
        </div>

        <h2>
            Video Publishing
        </h2>

        <p>
            Videos submitted by users will appear
            here for owner review and publishing.
        </p>

        <button
            class="publish-btn"
            onclick="publishVideo()">
            + PUBLISH VIDEO
        </button>

    </div>

</main>


<script>

function publishVideo(){

    alert(
        "Video publishing system will be connected to the NEXORA database later."
    );

}

</script>

</body>
</html>
