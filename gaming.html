<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA | Gaming</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
}

/* NAVBAR */
nav{
    height:70px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:rgba(5,8,22,0.96);
    border-bottom:1px solid rgba(139,92,246,0.25);
}

.logo{
    color:#a855f7;
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#a855f7;
}


/* MAIN */
.container{
    max-width:1200px;
    margin:auto;
    padding:60px 20px;
}


/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.title h1{
    font-size:45px;
    background:linear-gradient(90deg,#8b5cf6,#d946ef);
    -webkit-background-clip:text;
    color:transparent;
}

.title p{
    color:#888;
    margin-top:8px;
}


/* UPLOAD BUTTON */
.upload-btn{
    display:inline-block;
    padding:13px 20px;
    background:#8b5cf6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

.upload-btn:hover{
    background:#a855f7;
    transform:translateY(-2px);
}


/* SEARCH */
.search-box{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.search-box input{
    flex:1;
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(139,92,246,0.3);
    background:#0b0f25;
    color:white;
    outline:none;
}

.search-box button{
    padding:0 25px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* COUNT */
.count{
    color:#999;
    margin:15px 0 25px;
}

.count strong{
    color:#a855f7;
}


/* EMPTY */
.empty{
    text-align:center;
    padding:80px 20px;
    border:1px solid rgba(139,92,246,0.2);
    border-radius:18px;
    background:rgba(15,12,35,0.5);
}

.empty-icon{
    font-size:55px;
    margin-bottom:20px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#777;
}


/* GAME CONTAINER */
.games{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}


/* MOBILE */
@media(max-width:800px){

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .games{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:38px;
    }

}

@media(max-width:500px){

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:14px;
    }

}
</style>
</head>

<body>


<!-- NAVBAR -->
<nav>

    <div class="logo">
        NEXORA
    </div>

    <a href="index.html">
        ← Back to Home
    </a>

</nav>


<main class="container">


    <!-- TOP -->
    <div class="top">

        <div class="title">

            <h1>GAMING</h1>

            <p>
                Discover games inside NEXORA
            </p>

        </div>


        <a href="upload.html" class="upload-btn">
            ⬆ UPLOAD GAME
        </a>

    </div>


    <!-- SEARCH -->
    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search games..."
        >

        <button onclick="searchGames()">
            SEARCH
        </button>

    </div>


    <!-- COUNT -->
    <div class="count">

        Total
        <strong id="gameCount">0</strong>
        Games in NEXORA

    </div>


    <!-- GAMES -->
    <div class="games" id="gamesContainer">
    </div>


    <!-- EMPTY -->
    <div class="empty" id="emptyBox">

        <div class="empty-icon">
            🎮
        </div>

        <h2>
            No Games Yet
        </h2>

        <p>
            Be the first person to upload a game to NEXORA.
        </p>

    </div>


</main>


<script>

function searchGames(){

    const search =
        document.getElementById("searchInput").value.trim();

    if(search === ""){

        alert("Please enter a game name.");

        return;

    }

    alert(
        "Game search will work automatically after the NEXORA database is connected."
    );

}

</script>

</body>
</html>
